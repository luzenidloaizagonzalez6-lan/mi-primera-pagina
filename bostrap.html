  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Modal</title>
    <link rel="stylesheet" href="bostrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <header>
      <p></p>
      <div class="container mt-5">
        <button class="float-end" data-bs-toggle="modal" href="#loginModal">Iniciar Sesion</button>
        <span>Bienvenid@s</span>
      </div>
      <div class="modal" id="loginModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-titulo">Iniciar Sesión</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <form>
                <label class="form-label">Correo</label>
                <input type="email" class="form-control">

                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control">
                <div class="form-check float-start">
                  <input class="form-check-input" type="checkbox">
                  <label class="form-check-label">Recordarme</label>
                </div>
                <button type="button" class="float-end" data-bs-toggle="modal" data-bs-target="#RegistroModal">Registrate</button>
                <button class=" w-100 mt-3">Ingresar </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="modal" id="RegistroModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-titulo">Crea tu usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <form>
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control">

                <label class="form-label">Apellido</label>
                <input type="text" class="form-control">

                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control">

                <label class="form-label">Telefono</label>
                <input type="number" class="form-control">

                <label class="form-label">Crea tu correo</label>
                <input type="email" class="form-control">

                <label class="form-label">Crea tu contraseña</label>
                <input type="password" class="form-control">
              </form>
              <a class="float-end" data-bs-toggle="modal" data-bs-target="#loginModal" href="#loginModal">↩️ Regresar</a>
              <button class=" w-100 mt-3">Ingresar </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <hr>
  <div class="carousel">
    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="img/php.JPG"  alt="PHP">
        </div>
        <div class="carousel-item">
          <img src="img/c++.JPG"  alt="C++">
        </div>
        <div class="carousel-item">
          <img src="img/js.JPG"  alt="JS">
        </div>
        <div class="carousel-item">
          <img src="img/py.JPG"  alt="PY">
        </div>
      </div>
      <button id="btnprev" class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button id="btnnext" class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
