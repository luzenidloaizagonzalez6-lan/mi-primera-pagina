  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Modal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <header>
      <div class="container mt-5" >
        <div class="row align-items-center">
          <div class="row text-center">
            <div class="col-sm-6">
              <img src="img/logo.png" class="img-fluis" alt="logo">
            </div>
            <div class="col-sm-6  align-items-center pt-4" id="text">
              <span>Bienvenid@s</span><br><br>
              <button data-bs-toggle="modal" href="#loginModal">Iniciar Sesion</button>
            </div>
          </div>
        </div>
        <div class="modal" id="loginModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-titulo">Iniciar Sesión</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <form>
                <label class="form-label">Correo</label>
                <input type="email" class="form-control">

                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control">
                <div class="form-check float-start">
                  <input class="form-check-input" type="checkbox">
                  <label class="form-check-label">Recordarme</label>
                </div>
                <button type="button" class="float-end" data-bs-toggle="modal" data-bs-target="#RegistroModal">Registrate</button>
                <button class=" w-100 mt-3">Ingresar </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="modal" id="RegistroModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-titulo">Crea tu usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <form>
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control">

                <label class="form-label">Apellido</label>
                <input type="text" class="form-control">

                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control">

                <label class="form-label">Telefono</label>
                <input type="number" class="form-control">

                <label class="form-label">Crea tu correo</label>
                <input type="email" class="form-control">

                <label class="form-label">Crea tu contraseña</label>
                <input type="password" class="form-control">
              </form>
              <a class="float-end" data-bs-toggle="modal" data-bs-target="#loginModal" href="#loginModal">↩️ Regresar</a>
              <button class=" w-100 mt-3">Ingresar </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <hr>
<div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-item">

        </div>

    </div>

      </div>

      <div class="col-md-4 mb-3">
        <h5>Enlaces</h5>

          <li><a href="#" class="text-white text-decoration-none">Servicios</a></li>
          <li><a href="#" class="text-white text-decoration-none">Contacto</a></li>
        </ul>
      </div>

      <div class="col-md-4 mb-3">
        <h5>Sígueme</h5>
        <a href="#" class="text-white me-3">Facebook</a>

      <p class="mb-0"> ®  Luz Loaiza</p>
